<!DOCTYPE html>
<html>
<head>
    <title>RemoteDesk Viewer</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #screen { max-width: 100%; max-height: 100vh; border: 2px solid #333; }
        #status { position: fixed; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px; font-family: Arial; }
    </style>
</head>
<body>
    <div id="status">Connecting...</div>
    <img id="screen" src="" alt="Remote Screen"/>

    <script>
        const ws = new WebSocket('ws://localhost:8080');
        const screenImg = document.getElementById('screen');
        const status = document.getElementById('status');

        screenImg.addEventListener('click', (e) => {
            const rect = screenImg.getBoundingClientRect();
            const scaleX = screenImg.naturalWidth / rect.width;
            const scaleY = screenImg.naturalHeight / rect.height;
            const x = Math.round((e.clientX - rect.left) * scaleX);
            const y = Math.round((e.clientY - rect.top) * scaleY);
            ws.send('MOUSE_CLICK:' + x + ':' + y);
        });

        screenImg.addEventListener('mousemove', (e) => {
            const rect = screenImg.getBoundingClientRect();
            const scaleX = screenImg.naturalWidth / rect.width;
            const scaleY = screenImg.naturalHeight / rect.height;
            const x = Math.round((e.clientX - rect.left) * scaleX);
            const y = Math.round((e.clientY - rect.top) * scaleY);
            ws.send('MOUSE_MOVE:' + x + ':' + y);
        });

        ws.onopen = () => {
            ws.send('REGISTER:VIEWER');
            status.textContent = 'Connected';
            status.style.background = 'rgba(0,128,0,0.7)';
        };

        ws.onmessage = (event) => {
            const msg = event.data;
            if (msg.startsWith('SCREEN:')) {
                const base64 = msg.substring(7);
                screenImg.src = 'data:image/jpeg;base64,' + base64;
            }
        };

        ws.onclose = () => {
            status.textContent = 'Disconnected';
            status.style.background = 'rgba(255,0,0,0.7)';
        };

        ws.onerror = () => {
            status.textContent = 'Error';
            status.style.background = 'rgba(255,0,0,0.7)';
        };
    </script>
</body>
</html>
